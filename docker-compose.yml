# 로컬 개발 / OCI 배포 공통으로 쓰는 구성.
# MySQL, 서버 모두 컨테이너로 띄운다.
# 버전: MySQL 9.7.2, Node 24.20.0(server/Dockerfile)

services:
  mysql:
    image: mysql:9.7.2
    container_name: work-check-mysql
    restart: unless-stopped
    environment:
      # ${DB_PASSWORD}는 docker-compose.yml과 같은 디렉터리의 .env(server/.env가
      # 아니라 루트의 .env — Compose 자체의 변수치환용 파일, git에 안 올라감)에서
      # 읽어옴. 로컬 개발은 그 파일이 없어도 되게 기본값 'password' 유지
      # OCI는 이 .env에 server/.env의 DB_PASSWORD와 똑같은 값을 넣어둬야
      # 서버 컨테이너가 쓰는 비밀번호랑 MySQL의 실제 root 비밀번호가 일치함.
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: work_check
      TZ: Asia/Seoul
    ports:
      # 호스트 3305 → 컨테이너 3306. 호스트에 네이티브 MySQL(3306 사용 중)이
      # 있어도 충돌 없게 호스트 쪽 포트만 바꿈. 컨테이너 내부 포트는 그대로 3306.
      - '3305:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    # 로컬: `docker compose up -d --build`가 build:로 이 이미지를 직접 빌드해서
    # 이 이름으로 태그함. OCI: GitHub Actions가 이 이름으로 미리 빌드해 GHCR에
    # 올려두고, OCI는 `docker compose pull`로 받기만 함(OCI 무료 티어는 램이
    # 작아서 서버에서 직접 빌드하면 느리거나 OOM 위험 — 빌드는 CI 러너에서).
    image: ghcr.io/dpclfk/work-check-server:latest
    container_name: work-check-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # 같은 compose 네트워크 안에서는 서비스 이름(mysql)이 곧 호스트명이고,
      # 포트도 호스트 매핑(3305)이 아니라 컨테이너 내부 포트(3306) 그대로 씀.
      # .env의 DB_HOST/DB_PORT를 오버라이드.
      DB_HOST: mysql
      DB_PORT: '3306'
      # Alpine 기본 타임존은 UTC라서, 이게 없으면 reminderTime("21:00" 등) 비교가
      # 실제로는 UTC 기준으로 동작해 한국시간이랑 9시간 밀림.
      TZ: Asia/Seoul
    ports:
      - '3030:3030'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
